name: Run Tests

on: push

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Node dependencies
        run: npm install

      - name: Force Express 5 (matches local dev environment)
        run: npm install express@5.2.1

      - name: Install Python dependencies
        run: pip install requests pytest pytest-playwright python-dotenv --break-system-packages

      - name: Install Playwright browsers
        run: playwright install --with-deps

      - name: Start server in background
        run: nohup node server.js > server.log 2>&1 &

      - name: Wait for server
        run: sleep 5

      - name: Run setup script (creates .env, registers test users)
        run: python setup.py

      - name: Run API tests
        run: python -m pytest tests/api/ -v

      - name: Start HTTP server for UI
        run: nohup python -m http.server 8080 > http.log 2>&1 &

      - name: Wait for HTTP server
        run: sleep 3

      - name: Run UI tests
        run: python -m pytest tests/ui/ -v